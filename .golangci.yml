# golangci-lint v2 configuration — "the config in repo is law" (CLAUDE.md).
version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (*google.golang.org/grpc.ClientConn).Close
        - (*github.com/jackc/pgx/v5.Conn).Close
        - (*database/sql.DB).Close
        - (*net/smtp.Client).Close
        - fmt.Fprintf
        - fmt.Fprintln
        - os.RemoveAll
    gosec:
      excludes:
        - G104 # covered by errcheck
        - G304 # file paths come from config/flags by design; validated where user-controlled
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
        - name: var-naming
          disabled: true
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
  exclusions:
    generated: strict
    paths:
      - internal/proto
      - internal/server/api/apigen
      - internal/server/store/db
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, noctx, bodyclose, contextcheck, usestdlibvars, gocritic]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/nobrain-soft/libremanager]
