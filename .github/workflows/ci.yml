name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (lint, test, vuln, gen-check)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      STELLWERK_TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install tools
        run: make tools
      - name: buf lint + breaking
        run: |
          buf lint
          if git rev-parse --verify origin/main >/dev/null 2>&1; then buf breaking --against '.git#branch=origin/main'; fi
      - name: generated code is up to date
        run: |
          buf generate
          oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
          sqlc generate
          git diff --exit-code -- internal/proto internal/server/api/apigen internal/server/store/db
      - name: golangci-lint (incl. gosec)
        run: golangci-lint run ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: fuzz (short)
        run: |
          go test ./internal/common/envelope -run '^$' -fuzz FuzzVerify$ -fuzztime 30s
          go test ./internal/agent/policy -run '^$' -fuzz FuzzParse -fuzztime 20s
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  agent:
    name: agent (static build, budget)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build agent + helper (amd64, arm64)
        run: make agent
      - name: resource budget (binary < 20 MiB, RSS < 30 MiB, CPU < 1 %)
        run: make agent-bench
      - name: packages
        run: make packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-packages
          path: dist/*
          retention-days: 14

  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  image:
    name: server image
    runs-on: ubuntu-24.04
    needs: [go, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: stellwerk-server:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          sbom: true
          provenance: true
