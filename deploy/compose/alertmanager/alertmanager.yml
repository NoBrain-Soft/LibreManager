# Alertmanager groups/deduplicates/silences; every alert is forwarded to
# Stellwerk, which shows it in the UI and fans out to the e-mail and webhook
# channels configured there (Settings → Notifications).
route:
  receiver: stellwerk
  group_by: [alertname, host_id]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: stellwerk
    webhook_configs:
      - url: http://api:8080/api/v1/alertmanager/webhook
        send_resolved: true
        max_alerts: 500
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/token

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, host_id]
